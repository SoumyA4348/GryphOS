services:
  mongo:
    image: mongo:7.0
    container_name: gryphos-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gryphos-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gryphos-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - MONGO_URL=${MONGO_URL:-mongodb://mongo:27017/gryph-os}
      - DB_NAME=${DB_NAME:-gryph-os}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000,http://frontend}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - gryphos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gryphos-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gryphos-network

networks:
  gryphos-network:
    driver: bridge

volumes:
  mongo_data:
